name: NekoFaceCluster
options:
  bundleIdPrefix: com.chibakuma
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  NekoFaceCluster:
    type: application
    platform: macOS
    sources:
      - path: NekoFaceCluster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chibakuma.NekoFaceCluster
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        CODE_SIGN_ENTITLEMENTS: NekoFaceCluster/NekoFaceCluster.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
